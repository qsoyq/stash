<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>NodeSeek navigation regression checks</title>
<pre id="result">Running…</pre>
<script type="module">
// Serve the repository root over HTTP, then open /tests/nodeseek-navigation.html.
// These checks use the browser's DOM and the production injection function.
const output = document.querySelector('#result');
try {
    const response = await fetch('../script/ad/nodeseek.js');
    if (!response.ok) throw new Error(`Script fetch failed: ${response.status}`);
    const source = await response.text();
    const start = source.indexOf('function removeAdsCode(');
    const end = source.indexOf('\nfunction removeAds(document', start);
    if (start < 0 || end < 0) throw new Error('Injection function not found');
    const run = new Function('document', 'window', `${source.slice(start, end)}; return removeAdsCode;`);
    const original = ['日常', '技术', '情报', '测评', '交易', '拼车', '推广', 'DF'];
    let passed = 0;
    function check({ all = true, enabled = true, order, expected, path = '/categories/life', both = false }) {
        const doc = document.implementation.createHTMLDocument('fixture');
        const items = (all ? ['全部', ...original] : original).map(name => {
            const href = name === '全部' ? '/' : name === 'DF' ? 'https://www.deepflood.com/' : `/categories/${name}`;
            return `<li data-original="${name}"><a href="${href}">${name}</a></li>`;
        }).join('');
        const nav = className => `<ul class="${className} extra">${items}</ul>`;
        doc.body.innerHTML = nav(all ? 'mobile-nav' : 'nav-menu') + (both ? nav('nav-menu') : '') + `
            <div class="nsk-panel category-list" style="display:none">
                <a href="/categories/life"><svg></svg><span>生活</span></a>
                <a href="/categories/dev">Dev</a>
                <a href="/categories/photo-share">贴图</a>
                <a href="/categories/expose">曝光</a>
                <a href="/categories/meaningless">无意义</a>
                <a href="/categories/sandbox">沙盒</a>
                <a href="/categories/../../evil">错误入口</a>
            </div>`;
        const panel = doc.querySelector('.category-list').innerHTML;
        const allNode = doc.querySelector('[data-original="全部"]');
        run(doc, { location: { href: `https://www.nodeseek.com${path}` } })({
            show_inside_nav: enabled, enable_swipe: false, navigation_order: order,
        });
        doc.dispatchEvent(new Event('DOMContentLoaded'));
        const assert = (condition, message) => { if (!condition) throw new Error(message); };
        for (const element of doc.querySelectorAll('ul.mobile-nav, ul.nav-menu')) {
            const names = Array.from(element.querySelectorAll('a'), link => link.textContent);
            assert(JSON.stringify(names) === JSON.stringify(expected), `Expected ${expected}; got ${names}`);
            const life = Array.from(element.querySelectorAll('a')).find(link => link.textContent === '生活');
            if (life) {
                assert(life.getAttribute('href') === '/categories/life', 'Incorrect life URL');
                assert(life.parentElement.classList.contains('current-category'), 'Life should be selected');
                assert(!life.querySelector('svg'), 'Sidebar icons should not enter navigation');
            }
            const daily = element.querySelector('[data-original="日常"]');
            if (daily) assert(daily.querySelector('a').getAttribute('href') === '/categories/日常', 'Original URL changed');
        }
        if (allNode) assert(doc.querySelector('ul').firstElementChild === allNode, 'All node was replaced');
        assert(doc.querySelector('.category-list').innerHTML === panel, 'Sidebar links were moved');
        passed++;
    }
    check({ order: ['日常', '技术', '情报', '生活', '内版'], expected: ['全部', '日常', '技术', '情报', '生活', '内版'], both: true });
    check({ all: false, order: ['生活', '日常', '内版'], expected: ['生活', '日常', '内版'] });
    check({ order: ['Dev', '贴图', '曝光', '无意义', '沙盒'], expected: ['全部', 'Dev', '贴图', '曝光', '无意义', '沙盒'] });
    check({ order: ['不存在', '错误入口', '生活'], expected: ['全部', '生活'] });
    check({ order: [], expected: ['全部'] });
    check({ all: false, order: [], expected: [] });
    check({ enabled: false, order: ['生活'], expected: ['全部', ...original] });
    check({ all: false, enabled: false, order: ['生活'], expected: original });
    output.textContent = `PASS: ${passed} navigation regression cases`;
    document.documentElement.dataset.result = 'pass';
} catch (error) {
    output.textContent = `FAIL: ${error.stack || error}`;
    document.documentElement.dataset.result = 'fail';
}
</script>
</html>
